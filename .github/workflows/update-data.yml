name: Update LoL Jungle Data

on:
  workflow_dispatch: # GitHubのブラウザ画面から「Run workflow」ボタンで手動実行可能
  schedule:
    # 隔週木曜日（パッチ日）の日本時間 12:00 (UTC 03:00) に自動実行
    - cron: '0 3 * * 4'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run OP.GG Data Fetcher
        run: |
          python scripts/fetch_opgg.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js opgg_stats.json opgg_stats.js
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update LoL jungle stats to latest patch [skip ci]"
            git push origin main
          fi
